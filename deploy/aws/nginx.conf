limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
server {
    listen 80 default_server;
    server_name __PUBLIC_IP__;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/letsencrypt; }
    location / { return 301 https://__PUBLIC_IP__$request_uri; }
}
server {
    listen 443 ssl default_server;
    server_name __PUBLIC_IP__;
    ssl_certificate /etc/letsencrypt/live/dataguard-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dataguard-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    server_tokens off;
    root /opt/dataguard/current/Frontend/dist;
    index index.html;
    client_max_body_size 6m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/dataguard-proxy.conf;
    }
    location /api/ {
        include /etc/nginx/dataguard-proxy.conf;
    }
    location = /api/ingestion/events {
        client_max_body_size 8k;
        include /etc/nginx/dataguard-proxy.conf;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
